name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deployments vermeiden; laufende Runs nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Beide Werte kommen von der Pages-Konfiguration: base_path ist ""
      # bei eigener Domain und "/website" bei der github.io-Adresse, origin
      # die zugehörige Host-Adresse. Damit stimmen relative_url (Links im
      # Template) und absolute_url (hreflang, og:url) an beiden Orten.
      - name: Build
        run: |
          printf 'url: "%s"\n' "${{ steps.pages.outputs.origin }}" > _config_pages.yml
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
