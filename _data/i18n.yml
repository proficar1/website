    usp_3_t: Persönliche Beratung
    usp_3_d: Direkter Draht zum Inhaber und zum Sales Manager – zweisprachig DE / IT.
    usp_4_t: Lieferung in DE, AT, IT
    usp_4_d: Aus Südtirol heraus in den gesamten deutsch- und italienischsprachigen Raum.
